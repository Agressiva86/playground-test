name: Playground Live Preview

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Preview Link
        id: generate-link
        run: |
          # Replace USER and REPO placeholders in blueprint.json with current repo info
          REPO_FULL_NAME="${{ github.repository }}"
          USER_NAME=$(echo $REPO_FULL_NAME | cut -d'/' -f1)
          REPO_NAME=$(echo $REPO_FULL_NAME | cut -d'/' -f2)
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          
          # Construct the raw URL for the blueprint in this branch
          BLUEPRINT_URL="https://raw.githubusercontent.com/$REPO_FULL_NAME/$BRANCH_NAME/blueprint.json"
          
          # Construct the Playground URL
          PLAYGROUND_URL="https://playground.wordpress.net/?blueprint-url=$BLUEPRINT_URL"
          
          echo "url=$PLAYGROUND_URL" >> $GITHUB_OUTPUT
          echo "Preview URL: $PLAYGROUND_URL"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🚀 WordPress Playground Preview\n\nYou can preview the changes in this PR live in your browser:\n\n[**Open WordPress Playground**](${{ steps.generate-link.outputs.url }})`
            })
