name: Create Plugin Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Zip Plugin
        run: |
          rm -rf playground-patterns plugin.zip
          mkdir playground-patterns
          cp -a plugin/. playground-patterns/
          zip -r plugin.zip playground-patterns/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Release v${{ github.run_number }}"
          body: |
            New patterns plugin release for WordPress Playground.

            Download the `plugin.zip` below and use it in your [WordPress Playground](https://playground.wordpress.net/) blueprint.
          files: |
            plugin.zip
            content/export.wxr
          draft: false
          prerelease: false

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "Latest Release"
          body: |
            The most recent patterns plugin release.

            [Open in WordPress Playground](https://playground.wordpress.net/?blueprint-url=https://raw.githubusercontent.com/${{ github.repository }}/main/blueprint.json)
          files: |
            plugin.zip
            content/export.wxr
          draft: false
          prerelease: false
